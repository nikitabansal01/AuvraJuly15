services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Environment settings (supports both development and production)
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Server settings
      - HOST=0.0.0.0
      - PORT=8000
      
      # Database settings (environment variables take precedence, fallback to defaults)
      - DATABASE_URL=${DATABASE_URL:-postgresql://auvra_user:auvra_password@db:5432/auvra_db}
      
      # Firebase settings (environment variables take precedence)
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-auvra-adf59}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      
      # AI settings
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CURRENT_MODEL=${CURRENT_MODEL:-gpt-4o}
      - FALLBACK_MODEL=${FALLBACK_MODEL:-gpt-4o}
      
      # RAG settings
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - FIRECRAWL_BASE_URL=${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev/v0/scrape}
      
      # Pinecone settings
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT}
      - PINECONE_INDEX=${PINECONE_INDEX}
      
      # Security settings
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here-change-in-production}
      
      # CORS settings (environment variables take precedence, fallback to allow all hosts)
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}

      
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - auvra-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-auvra_db}
      - POSTGRES_USER=${POSTGRES_USER:-auvra_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-auvra_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - auvra-network



  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - auvra-network

volumes:
  postgres_data:

networks:
  auvra-network:
    driver: bridge 