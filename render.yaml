services:
  - type: web
    name: auvra-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Never serve traffic against a schema whose migrations failed.
    startCommand: alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Readiness checks the database; /api/v1/health remains a lightweight liveness probe.
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: LANGGRAPH_CHECKPOINT_POSTGRES_DSN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: "auvra-papers"
      - key: PINECONE_ENVIRONMENT
        value: "us-east-1"
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_LLM_OTHERS
        value: "true"
      - key: LLM_OTHERS_TIMEOUT
        value: "30"
    
      - key: RUNPOD_API_KEY
        sync: false
