# AUVRA v2 production blueprint.  This file is intentionally source-only; set
# every ``sync: false`` value in Render after owner approval and credential
# rotation.
#
# DATABASE_URL deliberately points at the same Supabase project as the legacy
# service, not an isolated database. The original plan called for a separate
# shadow database, but this workspace has no privilege to create a new
# Supabase project in the org, so isolation is enforced at the schema level
# instead: the v2 chain owns only the `app`/`ops` schemas (see
# alembic/recovery_versions/), records its own head in
# `public.alembic_version_v2` rather than the legacy `public.alembic_version`,
# and every v2 migration is additive-only with respect to `public.*`. Verified
# by tests/test_v2_migration_architecture.py and tests/test_v2_deployment_boundary.py.
#
# Deployed 2026-08-08: auvra-v2-worker is live (srv-d9romdqjnfac7385gqeg).
# auvra-v2-api is created and fully configured (srv-d9romrijnfac7385hfa0,
# https://auvra-v2-api.onrender.com) but cannot start: FIREBASE_PRIVATE_KEY_ID
# and FIREBASE_CLIENT_ID are only in the original Firebase service-account
# JSON, which is not recoverable from the private key material already in use
# and was not re-obtained in this session. Supply both from the Firebase
# console (Project Settings -> Service accounts -> Generate new private key,
# project auvra-adf59) to unblock the API deploy.
#
# Both services build the identical Dockerfile from one protected commit. CI
# must promote one immutable registry image before a public production cutover;
# that external promotion pipeline is not represented by this source blueprint.
services:
  - type: web
    name: auvra-v2-api
    runtime: docker
    dockerCommand: uvicorn app.v2.main:app --host 0.0.0.0 --port $PORT
    # Render executes this once for this deployment before traffic reaches the
    # service. The API start command never runs migrations.
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v2/health/ready
    maxShutdownDelaySeconds: 40
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      # The v2 deployment uses direct PostgreSQL connections with one bounded
      # pool per Render process.  Set `pooler` and both pool counts to zero
      # together only when a transaction pooler is explicitly selected.
      - key: DATABASE_CONNECTION_MODE
        value: direct
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: DATABASE_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: V2_GUEST_PROOF_SECRET
        sync: false
      - key: V2_REQUIRED_CONSENT_VERSIONS
        sync: false
      # Redis only stores expiring abuse-control counters in the API. It must
      # be the isolated, TLS Redis URL for this environment.
      - key: V2_REDIS_URL
        sync: false
      - key: V2_MAX_REQUEST_BODY_BYTES
        value: "1048576"
      - key: V2_PUBLIC_ONBOARDING_LIMIT
        value: "10"
      - key: V2_PUBLIC_ONBOARDING_WINDOW_SECONDS
        value: "600"
      - key: V2_COSTLY_MUTATION_LIMIT
        value: "6"
      - key: V2_COSTLY_MUTATION_WINDOW_SECONDS
        value: "300"
      - key: V2_TRUSTED_PROXY_CIDRS
        value: "[]"
      # A non-secret routing gate. It must match the approved worker release
      # before the API will create durable deletion requests.
      - key: V2_DELETION_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false

  - type: worker
    name: auvra-v2-worker
    runtime: docker
    dockerCommand: python -m app.v2.infrastructure.plan_worker_entrypoint
    maxShutdownDelaySeconds: 40
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CONNECTION_MODE
        value: direct
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: DATABASE_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: DATABASE_POOL_RECYCLE_SECONDS
        value: "1800"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: V2_GEMINI_API_KEY
        sync: false
      - key: V2_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: V2_TELEMETRY_HMAC_KEY
        sync: false
      - key: V2_CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: V2_CLOUDFLARE_API_TOKEN
        sync: false
      - key: V2_CLOUDFLARE_IMAGE_MODEL
        value: "@cf/black-forest-labs/flux-1-schnell"
      - key: V2_SUPABASE_URL
        sync: false
      - key: V2_SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: V2_PLAN_MEDIA_BUCKET
        value: plan-images
      # Account exports are encrypted before upload; this worker is the only
      # process that receives the encryption key or private storage authority.
      - key: V2_ACCOUNT_EXPORT_ENCRYPTION_KEY
        sync: false
      - key: V2_ACCOUNT_EXPORT_BUCKET
        value: account-exports
      # Deletion remains disabled until the owner/legal decision and all
      # provider credentials are configured together.
      - key: V2_DELETION_ENABLED
        value: "false"
      - key: V2_DELETION_APPROVAL_REFERENCE
        sync: false
      - key: AUVRA_DELETION_RECEIPT_HMAC_KEY
        sync: false
      - key: V2_REDIS_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: V2_PUBMED_TOOL
        value: auvra
      - key: V2_PUBMED_EMAIL
        sync: false
      - key: V2_WORKER_LEASE_SECONDS
        value: "60"
      - key: V2_PLAN_JOB_TIMEOUT_SECONDS
        value: "300"
      - key: V2_CONVERSATION_JOB_TIMEOUT_SECONDS
        value: "90"
      - key: V2_WORKER_SHUTDOWN_SECONDS
        value: "30"
