services:
  - type: web
    name: auvra-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head; uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: "auvra-papers"
      - key: PINECONE_ENVIRONMENT
        value: "us-east-1"
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_LLM_OTHERS
        value: "true"
      - key: LLM_OTHERS_TIMEOUT
        value: "30"
      # Action Plan System - Image Generation
      - key: RUNPOD_API_KEY
        sync: false
      - key: RUNPOD_ENDPOINT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false