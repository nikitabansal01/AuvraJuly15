services:
  - type: web
    name: auvra-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: |
      # Run database migration
      alembic upgrade head || echo "Migration failed, continuing..."
      # Start application
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      # OpenAI API - REQUIRED for chatbot (LangGraph agent, voice transcription, memory)
      - key: OPENAI_API_KEY
        sync: false
      # Groq API - Optional fallback LLM
      - key: GROQ_API_KEY
        sync: false
      # Pinecone - REQUIRED for chatbot RAG (search_health_knowledge tool)
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: "auvra-papers"
      - key: PINECONE_ENVIRONMENT
        value: "us-east-1"
      # Gemini LLM for "Others" text processing (V3 recommendations)
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_LLM_OTHERS
        value: "true"
      - key: LLM_OTHERS_TIMEOUT
        value: "30"

 